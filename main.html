<!DOCTYPE html>
<html lang="en">

<head>
    <title>Schedulr - Home</title>
    <meta name="comp1800 template" content="Schedulr App">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS & Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Web Components for shared navbar and footer layout -->
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>

    <style>
        /* Override any global white container rules */
        .container,
        .container-fluid {
            background-color: transparent !important;
        }

        .home-card {
            background-color: #1E1E1E;
            border: 1px solid #2e2e2e;
            border-radius: 18px;
            max-width: 600px;
            width: 100%;
        }

        .home-subtitle {
            color: #b5b5bd;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        #name-goes-here {
            color: #f49d0c;
            font-weight: 700;
        }

        #sched-butt {
            background-color: #f49d0c;
            color: #121212;
            border: none;
        }

        #sched-butt:hover {
            background-color: #ffae24;
            color: #121212;
        }
    </style>
</head>

<body class="text-light d-flex flex-column min-vh-100 m-0" style="background-color: #121212 !important; padding-bottom: 5.5rem;">

    <!-- Top Brand Header (No Buttons) -->
    <nav class="navbar navbar-dark px-4 py-3 border-bottom border-secondary" style="background-color: #1a1a1a !important;">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-white d-flex align-items-center" href="main.html">
                <i class="bi bi-calendar-check-fill me-2 fs-4" style="color: #f49d0c;"></i>Schedulr<span style="color: #f49d0c;">.</span>
            </a>
        </div>
    </nav>

    <!-- Main Homepage Content -->
    <main class="container my-auto d-flex justify-content-center align-items-center px-3 py-5">
        <div class="home-card p-4 p-md-5 text-center shadow-lg">
            <img
                class="d-block mx-auto mb-4 img-fluid"
                src="images/Sched.png"
                alt="Schedulr Logo"
                style="max-height: 200px; object-fit: contain;"
            >

            <h1 class="h3 fw-bold text-white mb-3">
                Welcome, <span id="name-goes-here">there</span>!
            </h1>

            <p class="home-subtitle mb-4">
                Ready to turn your fixed commitments and goals into a smart, stress-free schedule?
            </p>

            <div class="d-flex justify-content-center">
                <button
                    onclick="window.location.href='ex.html'"
                    class="btn btn-lg px-5 py-3 rounded-pill fw-bold shadow d-inline-flex align-items-center justify-content-center"
                    id="sched-butt"
                    type="button"
                >
                    Get Started <i class="bi bi-arrow-right ms-2"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- Shared Bottom Navbar / Footer Component -->
    <site-footer></site-footer>

    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
