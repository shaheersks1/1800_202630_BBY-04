<!DOCTYPE html>
<html lang="en">

<head>
    <title>Schedulr - Organize Your Life</title>
    <meta name="comp1800 template" content="Schedulr App">
    
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="text-light d-flex flex-column min-vh-100 m-0" style="background-color: #1E1E1E !important;">

    <!-- Sleek Minimalist Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark px-4 py-3 border-bottom border-secondary" style="background-color: #1E1E1E !important;">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-white d-flex align-items-center" href="index.html">
                <i class="bi bi-calendar-check-fill me-2 fs-4" style="color: #f49d0c;"></i>Schedulr<span style="color: #f49d0c;">.</span>
            </a>
            <div class="ms-auto">
                <a href="login.html" class="btn btn-sm px-4 rounded-pill fw-semibold shadow-sm" style="background-color: transparent; border: 2px solid #f49d0c; color: #f49d0c;">Login / Sign Up</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section (Pure Dark Theme, No White Boxes) -->
    <main class="container-fluid my-auto text-center px-3 py-5" style="background-color: #1E1E1E !important; max-width: 650px;">
        <div class="d-flex flex-column align-items-center">
            
            <!-- Logo (Bigger & Seamless) -->
            <div class="mb-4">
                <img class="img-fluid" src="images/Sched.png" alt="Schedulr Logo" style="max-height: 250px; object-fit: contain;">
            </div>

            <!-- Headline -->
            <h1 class="display-6 fw-bold mb-3 text-white">
                Organize Your Life, Effortlessly.
            </h1>

            <!-- Subtitle -->
            <p class="lead mb-5 px-lg-4" style="color: #b0b0b0; font-size: 1rem; line-height: 1.6;">
                Turn your big goals and daily commitments into an optimized, AI-powered smart schedule designed just for you.
            </p>

            <!-- Action Button (Perfectly Centered Text & Icon) -->
            <div class="w-100 px-4" style="max-width: 340px;">
                <button onclick="window.location.href='login.html'" class="btn btn-lg w-100 fw-bold py-3 rounded-pill shadow d-inline-flex align-items-center justify-content-center" id="sched-butt" type="button" style="background-color: #f49d0c; color: #121212; border: none;">
                    Get Started <i class="bi bi-arrow-right ms-2 fs-5"></i>
                </button>
            </div>

        </div>
    </main>

    <!-- Clean Footer -->
    <footer class="text-center py-3 border-top border-secondary mt-auto" style="background-color: #1a1a1a !important; color: #888888; font-size: 0.8rem;">
        <div class="container" style="background-color: transparent !important;">
            <p class="mb-0">&copy; 2026 Schedulr &bull; BCIT COMP 1800 Project</p>
        </div>
    </footer>

    <!-- JavaScript Bundle -->
    <script type="module" src="src/index.js"></script>

</body>

</html>
