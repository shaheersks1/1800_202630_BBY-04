<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <title>Organize Your Life. — Progress</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS & Icons (ensures navbars look crisp if not already bundled in app.js) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Google Fonts for Futuristic Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Web Components for shared navbar and footer layout -->
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --neon-blue: #3b82f6;
            --bg-pitch: #000000;
        }

        body {
            background-color: var(--bg-pitch);
            color: #ffffff;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            font-family: 'Rajdhani', sans-serif;
        }

        /* Interactive Fluid Canvas Background */
        #fluid-bg {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            background: #000000;
        }

        /* =========================================
           FUTURISTIC TOP & BOTTOM GLASS NAVS
           ========================================= */
        .cyber-top-nav {
            background: rgba(5, 8, 16, 0.72) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
            padding: 0.75rem 1.25rem;
        }

        .cyber-brand {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            letter-spacing: 0.08em;
            font-size: 1.15rem;
            background: linear-gradient(90deg, #ffffff, var(--neon-cyan));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            filter: drop-shadow(0 0 8px rgba(0, 243, 255, 0.35));
        }

        .cyber-top-nav .nav-link {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.65);
            padding: 0.45rem 1rem !important;
            border-radius: 8px;
            transition: all 0.25s ease;
        }

        .cyber-top-nav .nav-link:hover,
        .cyber-top-nav .nav-link.active {
            color: var(--neon-cyan);
            background: rgba(0, 243, 255, 0.08);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
        }

        /* Floating Futuristic Bottom Dock */
        .cyber-bottom-nav {
            background: rgba(6, 10, 20, 0.78) !important;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0, 243, 255, 0.25) !important;
            box-shadow: 0 -10px 35px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 243, 255, 0.08);
            padding: 0.45rem 0;
        }

        .cyber-bottom-nav .nav-link {
            color: rgba(255, 255, 255, 0.55);
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0.35rem 0.9rem;
            border-radius: 12px;
            position: relative;
            transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .cyber-bottom-nav .nav-link i {
            transition: transform 0.25s ease, text-shadow 0.25s ease;
        }

        .cyber-bottom-nav .nav-link:hover,
        .cyber-bottom-nav .nav-link.active {
            color: var(--neon-cyan);
            background: rgba(0, 243, 255, 0.09);
        }

        .cyber-bottom-nav .nav-link:hover i,
        .cyber-bottom-nav .nav-link.active i {
            transform: translateY(-2px);
            text-shadow: 0 0 12px var(--neon-cyan);
        }

        .cyber-bottom-nav .nav-link.active::after {
            content: "";
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 2px;
            background: var(--neon-cyan);
            box-shadow: 0 0 8px var(--neon-cyan);
            border-radius: 2px;
        }

        .cyber-dropdown-menu {
            background: rgba(8, 12, 24, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 243, 255, 0.25);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
        }

        .cyber-dropdown-menu .dropdown-item {
            color: rgba(255, 255, 255, 0.8);
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            letter-spacing: 0.06em;
        }

        .cyber-dropdown-menu .dropdown-item:hover {
            background: rgba(0, 243, 255, 0.14);
            color: var(--neon-cyan);
        }

        /* =========================================
           CENTER HUD PROGRESS CARD
           ========================================= */
        #progress-ting-div {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 140px);
            padding: 2rem;
            perspective: 1000px;
        }

        .cyber-hud-card {
            position: relative;
            padding: 3rem 3.5rem;
            border-radius: 24px;
            background: rgba(8, 12, 24, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 243, 255, 0.25);
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.95),
                0 0 35px rgba(0, 243, 255, 0.1),
                inset 0 0 20px rgba(0, 243, 255, 0.04);
            text-align: center;
            max-width: 720px;
            width: 100%;
            transform-style: preserve-3d;
            transition: transform 0.12s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.3s ease;
            overflow: hidden;
            cursor: default;
        }

        .cyber-hud-card:hover {
            border-color: rgba(0, 243, 255, 0.65);
        }

        .cyber-hud-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(
                450px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(0, 243, 255, 0.16),
                rgba(188, 19, 254, 0.08) 40%,
                transparent 75%
            );
            opacity: 0;
            transition: opacity 0.35s ease;
            pointer-events: none;
            z-index: 0;
        }

        .cyber-hud-card:hover::before {
            opacity: 1;
        }

        .hud-corner {
            position: absolute;
            width: 18px;
            height: 18px;
            border-color: var(--neon-cyan);
            border-style: solid;
            pointer-events: none;
            opacity: 0.75;
            transition: all 0.3s ease;
        }
        .cyber-hud-card:hover .hud-corner {
            width: 24px;
            height: 24px;
            opacity: 1;
            box-shadow: 0 0 10px var(--neon-cyan);
        }
        .hud-tl { top: 14px; left: 14px; border-width: 2px 0 0 2px; border-top-left-radius: 6px; }
        .hud-tr { top: 14px; right: 14px; border-width: 2px 2px 0 0; border-top-right-radius: 6px; }
        .hud-bl { bottom: 14px; left: 14px; border-width: 0 0 2px 2px; border-bottom-left-radius: 6px; }
        .hud-br { bottom: 14px; right: 14px; border-width: 0 2px 2px 0; border-bottom-right-radius: 6px; }

        .hud-label {
            position: relative;
            z-index: 1;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--neon-cyan);
            margin-bottom: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transform: translateZ(20px);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
            animation: pulseDot 2s infinite ease-in-out;
        }

        #progress-ting {
            position: relative;
            z-index: 1;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.6rem, 3.8vw, 2.6rem);
            font-weight: 900;
            letter-spacing: 0.04em;
            line-height: 1.3;
            margin: 0;
            background: linear-gradient(
                120deg,
                #ffffff 0%,
                #00f3ff 25%,
                #bc13fe 50%,
                #00f3ff 75%,
                #ffffff 100%
            );
            background-size: 250% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fluidShimmer 4.5s linear infinite;
            filter: drop-shadow(0 0 18px rgba(0, 243, 255, 0.35));
            transform: translateZ(40px);
            transition: filter 0.3s ease;
        }

        .cyber-hud-card:hover #progress-ting {
            filter: drop-shadow(0 0 26px rgba(0, 243, 255, 0.65));
        }

        .energy-track {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 999px;
            margin-top: 1.8rem;
            overflow: hidden;
            border: 1px solid rgba(0, 243, 255, 0.15);
            transform: translateZ(25px);
        }

        .energy-fill {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-cyan), var(--neon-purple));
            background-size: 200% 100%;
            box-shadow: 0 0 16px var(--neon-cyan);
            transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            animation: fluidShimmer 3s linear infinite;
        }

        @keyframes fluidShimmer {
            0% { background-position: 0% center; }
            100% { background-position: 250% center; }
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.75); }
        }
    </style>
</head>

<body>
    <!-- Interactive Pitch-Black Fluid Canvas Background -->
    <canvas id="fluid-bg"></canvas>

    <!-- Futuristic Top Navbar -->
    <nav class="navbar navbar-expand-lg cyber-top-nav">

            <button class="navbar-toggler border-info" type="button"

    <!-- Center Holographic HUD -->
    <div id="progress-ting-div">

            <div class="hud-label">
                <span class="status-dot"></span>

            </div>

            <p id="progress-ting">INITIALIZING TELEMETRY...</p>

    <!-- Futuristic Bottom Glass Dock -->
    <nav class="navbar fixed-bottom cyber-bottom-nav">
        <div class="container-fluid justify-content-around">
            
            <div class="dropup">
                <a class="nav-link text-center" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">

    <!-- Bootstrap JS Bundle (for dropdowns & mobile navbar toggle) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/app.js"></script>

    <script type="module">
        import { doc, onSnapshot } from "firebase/firestore";
        import { db } from "/src/firebaseConfig.js";
        import { onAuthReady } from "/src/authentication.js";

        // =========================================
        // 1. PITCH-BLACK INTERACTIVE FLUID BACKGROUND
        // =========================================
        const canvas = document.getElementById("fluid-bg");
        const ctx = canvas.getContext("2d");
        let width, height;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        const mouse = { x: width / 2, y: height / 2, targetX: width / 2, targetY: height / 2, active: false };
        const trail = [];

        window.addEventListener("mousemove", (e) => {
            mouse.targetX = e.clientX;
            mouse.targetY = e.clientY;
            mouse.active = true;

            // Spawn fluid plasma ribbons along cursor movement
            trail.push({
                x: e.clientX,
                y: e.clientY,
                vx: (Math.random() - 0.5) * 1.6,
                vy: (Math.random() - 0.5) * 1.6,
                radius: Math.random() * 90 + 70,
                hue: Math.random() > 0.45 ? 185 : 282, // Cyan & Electric Violet
                alpha: 0.24
            });

            if (trail.length > 32) trail.shift();
        });

        // Ambient drifting fluid orbs in the pitch-black void
        const ambientOrbs = Array.from({ length: 5 }, (_, i) => ({
            angle: (i * Math.PI * 2) / 5,
            speed: 0.004 + i * 0.001,
            radius: 260 + i * 45,
            hue: i % 2 === 0 ? 186 : 280
        }));

        function animateFluidBg() {
            // Smooth cursor interpolation
            mouse.x += (mouse.targetX - mouse.x) * 0.09;
            mouse.y += (mouse.targetY - mouse.y) * 0.09;

            // Pitch-black fade trail
            ctx.globalCompositeOperation = "source-over";
            ctx.fillStyle = "rgba(0, 0, 0, 0.18)";
            ctx.fillRect(0, 0, width, height);

            // Additive blending creates liquid neon energy merges
            ctx.globalCompositeOperation = "lighter";

            // Draw slow ambient morphing blobs in deep black space
            ambientOrbs.forEach((orb) => {
                orb.angle += orb.speed;
                const ox = width * 0.5 + Math.cos(orb.angle) * (width * 0.25);
                const oy = height * 0.5 + Math.sin(orb.angle * 1.3) * (height * 0.22);

                const grad = ctx.createRadialGradient(ox, oy, 0, ox, oy, orb.radius);
                grad.addColorStop(0, `hsla(${orb.hue}, 100%, 50%, 0.055)`);
                grad.addColorStop(1, "rgba(0, 0, 0, 0)");
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(ox, oy, orb.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw primary cursor fluid aura
            const cursorGrad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 240);
            cursorGrad.addColorStop(0, "rgba(0, 243, 255, 0.16)");
            cursorGrad.addColorStop(0.45, "rgba(188, 19, 254, 0.08)");
            cursorGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
            ctx.fillStyle = cursorGrad;
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 240, 0, Math.PI * 2);
            ctx.fill();

            // Draw liquid wake particles left by pointer
            for (let i = trail.length - 1; i >= 0; i--) {
                const p = trail[i];
                p.x += p.vx;
                p.y += p.vy;
                p.radius *= 0.975;
                p.alpha *= 0.94;

                if (p.alpha < 0.005) {
                    trail.splice(i, 1);
                    continue;
                }

                const pGrad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
                pGrad.addColorStop(0, `hsla(${p.hue}, 100%, 55%, ${p.alpha})`);
                pGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
                ctx.fillStyle = pGrad;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(animateFluidBg);
        }
        animateFluidBg();

        // =========================================
        // 2. HUD CARD 3D TILT & TEXT SCRAMBLE
        // =========================================
        const progressEl = document.getElementById("progress-ting");
        const energyFillEl = document.getElementById("energy-fill");
        const hudCard = document.getElementById("hud-card");

        hudCard.addEventListener("mousemove", (e) => {
            const rect = hudCard.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            hudCard.style.setProperty("--mouse-x", `${x}px`);
            hudCard.style.setProperty("--mouse-y", `${y}px`);

            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = ((y - centerY) / centerY) * -7;
            const rotateY = ((x - centerX) / centerX) * 7;

            hudCard.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        hudCard.addEventListener("mouseleave", () => {
            hudCard.style.transform = "rotateX(0deg) rotateY(0deg)";
        });

        let scrambleInterval = null;
        function scrambleText(finalText) {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/#%*<>";
            let iteration = 0;
            clearInterval(scrambleInterval);

            scrambleInterval = setInterval(() => {
                progressEl.innerText = finalText
                    .split("")
                    .map((letter, index) => {
                        if (letter === " ") return " ";
                        if (index < iteration) return finalText[index];
                        return chars[Math.floor(Math.random() * chars.length)];
                    })
                    .join("");

                if (iteration >= finalText.length) {
                    clearInterval(scrambleInterval);
                }
                iteration += 1 / 2;
            }, 22);
        }

        let latestDisplayText = "INITIALIZING TELEMETRY...";
        hudCard.addEventListener("mouseenter", () => {
            scrambleText(latestDisplayText);
        });

        // =========================================
        // 3. REAL-TIME FIRESTORE LISTENER
        // =========================================
        onAuthReady((user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            onSnapshot(doc(db, "users", user.uid), (userSnap) => {
                if (userSnap.exists()) {
                    const data = userSnap.data();
                    let completed = 0;
                    let total = 0;

                    if (data.progress) {
                        completed = data.progress.completed;
                        total = data.progress.total;
                        latestDisplayText = `${completed} / ${total} goal tasks completed`;
                    } else if (data.schedule) {
                        const goalTasks = data.schedule.filter(item => {
                            const cat = (item.category || "").toLowerCase();
                            return !cat.includes("school") && !cat.includes("work");
                        });
                        completed = goalTasks.filter(item => item.completed).length;
                        total = goalTasks.length;
                        latestDisplayText = `${completed} / ${total} goal tasks completed`;
                    } else {
                        latestDisplayText = "No schedule created yet.";
                    }

                    scrambleText(latestDisplayText);

                    const pct = total > 0 ? Math.min(100, Math.round((completed / total) * 100)) : 0;
                    energyFillEl.style.width = `${pct}%`;
                }
            });
        });
    </script>
</body>
